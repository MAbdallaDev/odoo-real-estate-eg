# CI: runs the same gates as `make lint` and `make test-ci` on every push and pull request.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Hook environments are slow to build; reuse them until the config changes
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install -r requirements-dev.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Postgres + the official Odoo 19 image (docker/docker-compose.ci.yml), then the log check
      - run: make test-ci
      - name: Keep the full Odoo log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: odoo-ci-log
          path: odoo-ci.log
