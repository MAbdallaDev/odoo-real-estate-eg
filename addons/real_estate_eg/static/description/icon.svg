<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#714B67"/>
  <!-- A tower of units -->
  <rect x="18" y="22" width="34" height="60" rx="2" fill="#FFFFFF"/>
  <g fill="#714B67">
    <rect x="23" y="28" width="9" height="7"/><rect x="38" y="28" width="9" height="7"/>
    <rect x="23" y="40" width="9" height="7"/><rect x="38" y="40" width="9" height="7"/>
    <rect x="23" y="52" width="9" height="7"/><rect x="38" y="52" width="9" height="7"/>
    <rect x="30" y="66" width="10" height="16"/>
  </g>
  <!-- The installments: a stack of equal payments -->
  <g fill="#F2D6A2" stroke="#714B67" stroke-width="2">
    <ellipse cx="70" cy="76" rx="14" ry="5"/>
    <rect x="56" y="66" width="28" height="10" stroke="none"/>
    <ellipse cx="70" cy="66" rx="14" ry="5"/>
    <rect x="56" y="56" width="28" height="10" stroke="none"/>
    <ellipse cx="70" cy="56" rx="14" ry="5"/>
    <rect x="56" y="46" width="28" height="10" stroke="none"/>
    <ellipse cx="70" cy="46" rx="14" ry="5"/>
  </g>
  <g stroke="#714B67" stroke-width="2" fill="none">
    <line x1="56" y1="46" x2="56" y2="76"/><line x1="84" y1="46" x2="84" y2="76"/>
  </g>
</svg>
